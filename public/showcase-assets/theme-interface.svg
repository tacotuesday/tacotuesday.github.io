<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#f3f0e7"/><text x="95" y="110" fill="#12232a" font-family="Arial,sans-serif" font-size="34" font-weight="700">Maintenance theme explorer</text><text x="95" y="150" fill="#526167" font-family="monospace" font-size="16">ILLUSTRATIVE INTERFACE · PUBLIC FAA REPORTS</text><g transform="translate(95 220)" font-family="Arial,sans-serif"><rect width="440" height="570" fill="#ebe7dc" stroke="#c9c7bd"/><text x="30" y="52" fill="#526167" font-size="16">THEMES / REVIEW QUEUE</text><g fill="#12232a" font-size="22"><text x="30" y="125">Hydraulic pressure language</text><text x="30" y="220">Connector wear reports</text><text x="30" y="315">Intermittent sensor terms</text><text x="30" y="410">Inspection follow-up</text></g><g stroke="#c9c7bd"><path d="M30 150H410M30 245H410M30 340H410M30 435H410"/></g><circle cx="392" cy="116" r="8" fill="#0d6f69"/></g><g transform="translate(575 220)" font-family="Arial,sans-serif"><rect width="930" height="260" fill="#f3f0e7" stroke="#c9c7bd"/><text x="30" y="52" fill="#526167" font-size="16">THEME VOLUME / TIME</text><path d="M40 205C150 190 220 215 310 160S470 75 550 135 690 225 880 65" fill="none" stroke="#0d6f69" stroke-width="6"/><path d="M40 205H890M40 135H890M40 65H890" stroke="#c9c7bd"/></g><g transform="translate(575 520)" font-family="Arial,sans-serif"><rect width="930" height="270" fill="#12232a"/><text x="30" y="48" fill="#72c9c0" font-size="16">SOURCE REPORT / EVIDENCE</text><text x="30" y="105" fill="#edf0e8" font-size="22">Original narrative remains linked to the theme.</text><text x="30" y="150" fill="#a8b4b4" font-size="18">Model version, time window and uncertainty appear alongside</text><text x="30" y="180" fill="#a8b4b4" font-size="18">the source rather than turning a cluster into a diagnosis.</text></g></svg>
